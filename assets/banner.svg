<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.05); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(0.98); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.1); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      .anim-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .anim-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .anim-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-card-2 {
        animation: floatRev 7s ease-in-out infinite;
      }
      .anim-card-3 {
        animation: floatSlow 8s ease-in-out infinite 1s;
      }
      .stream-line {
        stroke-dasharray: 8, 8;
        animation: dashAnim 15s linear infinite;
      }
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -1.2px;
      }
      .banner-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 21px;
        letter-spacing: -0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Dynamic Glowing Orbs in the Background -->
  <circle class="anim-orb-1" cx="220" cy="120" r="180" fill="url(#orbGrad1)" />
  <circle class="anim-orb-2" cx="1020" cy="280" r="220" fill="url(#orbGrad2)" />

  <!-- Flow / Network Lines in Background -->
  <path class="stream-line" d="M 50 350 Q 300 380 600 340 T 1150 370" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="stream-line" d="M 100 80 Q 400 30 700 90 T 1120 60" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Dynamic Floating Decorative Tech Badges on Sides (Out of title's way) -->
  <!-- Left Side Dynamic Badges -->
  <g class="anim-card-1" transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect width="180" height="48" rx="24" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="26" cy="24" r="8" fill="#38bdf8" />
    <text class="pill-text" x="44" y="29" fill="#e2e8f0">🚀 SLA Escalation</text>
  </g>
  <g class="anim-card-2" transform="translate(45, 230)" filter="url(#cardShadow)">
    <rect width="200" height="48" rx="24" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="26" cy="24" r="8" fill="#818cf8" />
    <text class="pill-text" x="44" y="29" fill="#e2e8f0">💬 Omnichannel Desk</text>
  </g>

  <!-- Right Side Dynamic Badges -->
  <g class="anim-card-3" transform="translate(950, 90)" filter="url(#cardShadow)">
    <rect width="190" height="48" rx="24" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="26" cy="24" r="8" fill="#c084fc" />
    <text class="pill-text" x="44" y="29" fill="#e2e8f0">🤖 AI Support Agents</text>
  </g>
  <g class="anim-card-1" transform="translate(930, 220)" filter="url(#cardShadow)">
    <rect width="210" height="48" rx="24" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="26" cy="24" r="8" fill="#34d399" />
    <text class="pill-text" x="44" y="29" fill="#e2e8f0">🛡️ Self-Hosted / SSO</text>
  </g>

  <!-- FOREGROUND: High Contrast, Guaranteed Crisp Visibility -->
  <!-- Category Tag -->
  <g transform="translate(450, 60)">
    <rect width="300" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
    <text x="150" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1.5">ENTERPRISE CUSTOMER SUPPORT</text>
  </g>

  <!-- Main Title -->
  <text class="banner-title" x="600" y="165" text-anchor="middle" fill="#ffffff" filter="url(#glow)">
    Awesome Enterprise Support
  </text>
  <text class="banner-title" x="600" y="165" text-anchor="middle" fill="url(#primaryGrad)">
    Awesome Enterprise Support
  </text>

  <!-- Subtitle -->
  <text class="banner-subtitle" x="600" y="215" text-anchor="middle" fill="#94a3b8">
    Curated SaaS Suites &amp; Production-Ready Open-Source Helpdesks
  </text>

  <!-- Feature Highlights Bar in Center -->
  <g transform="translate(300, 270)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="85" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🎯 Omnichannel Care</text>

    <!-- Pill 2 -->
    <rect x="190" y="0" width="180" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="280" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⚡ Strict Enterprise SLAs</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="210" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="495" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🔒 Data Privacy &amp; Self-Host</text>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#primaryGrad)" />
</svg>
